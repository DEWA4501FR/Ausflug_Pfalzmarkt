<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pfalzmarkt Ausflug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }
        .info-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1.1em;
            color: #fff;
            background-color: #28a745; /* Grüne Farbe, passend zum Markt */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #218838;
        }
        .participants {
            font-weight: bold;
            color: #dc3545; /* Rote Farbe, um Mindestteilnehmer hervorzuheben */
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- DAS BILD: Stellen Sie sicher, dass Ihre Bilddatei exakt Pfalzmarkt_KI.jpg heißt
             und im gleichen Ordner liegt wie diese HTML-Datei -->
        <img src="Pfalzmarkt_KI.jpg" alt="Ihr erstelltes Bild vom Pfalzmarkt">

        <h1>Ausflug zum Pfalzmarkt</h1>

        <div class="info-text">
            <p>Gemeinsamer Ausflug zum Pfalzmarkt, inklusive Führung und anschließendem Essen.</p>
            <p class="participants">Mindestanzahl Teilnehmer: 12</p>
        </div>

        <a href="https://www.pfalzmarkt.de" class="button" target="_blank">Zur Pfalzmarkt Webseite</a>
    </div>

</body>
</html>
